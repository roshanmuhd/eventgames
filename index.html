<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kibble Arcade · Spin to Play</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 0,#2a1b63,#120c33 60%,#080620);color:#fff;font:400 16px/1.5 Poppins,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas#bg,canvas#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#cf{z-index:30}
main{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,18px);padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));text-align:center}
.tag{font:800 12px Montserrat;letter-spacing:.35em;color:#FFC93C}
h1{font:800 clamp(38px,11vw,64px)/1 Montserrat;letter-spacing:-.02em;background:linear-gradient(180deg,#fff 30%,#FFC93C);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.sub{color:#b9b3e6;font-size:14px;max-width:32ch}
.wrap{position:relative;width:min(88vw,46vh,420px);aspect-ratio:1;filter:drop-shadow(0 24px 40px rgba(0,0,0,.55))}
.wrap::before{content:"";position:absolute;inset:-14%;background:radial-gradient(circle,rgba(255,201,60,.35),transparent 65%);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{opacity:.45;transform:scale(1.06)}}
#w{position:relative;width:100%;height:100%;display:block}
.spin{position:relative;border:0;cursor:pointer;font:800 24px Montserrat;letter-spacing:.08em;color:#3a2200;padding:16px 54px;border-radius:999px;background:linear-gradient(180deg,#FFE27A,#FFB300);box-shadow:0 7px 0 #B36B00,0 18px 30px -8px rgba(255,170,0,.65);animation:pulse 1.4s ease-in-out infinite;transition:transform .1s}
.spin:active{transform:translateY(5px);box-shadow:0 2px 0 #B36B00}
.spin:disabled{animation:none;filter:grayscale(.7) brightness(.7);cursor:default}
@keyframes pulse{50%{transform:scale(1.06)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font:700 12px Montserrat;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.ov{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(8,6,32,.78);backdrop-filter:blur(6px);padding:20px}
.ov.on{display:grid}
.card{width:100%;max-width:380px;border-radius:30px;padding:26px 22px;text-align:center;background:linear-gradient(160deg,#2d2170,#150f3d);border:1.5px solid rgba(255,255,255,.18);box-shadow:0 30px 80px -20px #000,0 0 60px -10px var(--gc);animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.5) rotate(-6deg);opacity:0}}
.ic{font-size:64px;line-height:1;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(6deg)}}
.you{font:800 12px Montserrat;letter-spacing:.3em;color:#FFC93C;margin-top:8px}
.gn{font:800 clamp(32px,9vw,42px)/1.05 Montserrat;margin:4px 0 6px;color:var(--gl)}
.card p{color:#b9b3e6;font-size:14px}
.go{border:0;cursor:pointer;font:800 18px Montserrat;letter-spacing:.05em;color:#fff;padding:15px;border-radius:16px;background:linear-gradient(180deg,var(--gl),var(--gc));box-shadow:0 5px 0 rgba(0,0,0,.4)}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
#cd{font:800 120px/1 Montserrat;color:#FFC93C;text-shadow:0 8px 0 rgba(0,0,0,.35);animation:pop .5s}
</style></head><body>
<canvas id="bg"></canvas><canvas id="cf"></canvas>
<main>
  <div class="tag">KIBBLE ARCADE</div>
  <h1>SPIN<br>TO PLAY!</h1>
  <p class="sub">Let the wheel pick your game. No take-backs, no swaps!</p>
  <div class="wrap"><canvas id="w"></canvas></div>
  <button class="spin" id="spin">SPIN!</button>
  <div class="chips"><span class="chip">🎯 Kibble Shooter</span><span class="chip">🌀 Maze Run</span><span class="chip">🕹️ Butcher's Claw Machine</span></div>
</main>

<div class="ov" id="res"><div class="card" id="card">
  <div class="ic" id="ic"></div><div class="you">YOUR GAME IS</div><div class="gn" id="gn"></div>
  <p>Get ready, your game is about to start!</p>
  <button class="go" id="play" style="width:100%;margin-top:16px">PLAY NOW →</button>
</div></div>
<div class="ov" id="lau"><div style="text-align:center"><div class="you" id="lt"></div><div id="cd">3</div></div></div>

<script>
/* ---------- CONFIG ---------- */
const GAMES=[
 {n:'Kibble Shooter',u:'https://roshanmuhd.github.io/kibbleshooter/',a:'#FF8566',b:'#C9341D',i:'🎯'},
 {n:'Maze Run',u:'https://roshanmuhd.github.io/mazerun/',a:'#9C8CFF',b:'#4B38C9',i:'🌀'},
 /* Butcher's Claw Machine is embedded in this file (see EMB). To launch a hosted copy instead, add  u:'https://...'  here. */
 {n:"Butcher's Claw Machine",t:'Claw Machine',e:'claw',a:'#FF7BC5',b:'#B3207A',i:'🕹️'}];
const NS=6,SL=Math.PI*2/NS,$=id=>document.getElementById(id);
let rot=0,spinning=false,done=false,pick=null,tt=0,lastTick=-1,wob=0;

/* ---------- audio ---------- */
let AX;const ac=()=>{try{AX=AX||new(window.AudioContext||window.webkitAudioContext)();AX.state==='suspended'&&AX.resume()}catch(e){}return AX};
function tone(f,d,ty,v,at){const x=ac();if(!x)return;const t=x.currentTime+(at||0),o=x.createOscillator(),g=x.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.1,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(x.destination);o.start(t);o.stop(t+d+.02)}
const tick=()=>tone(1100+Math.random()*150,.05,'triangle',.07);
const fanfare=()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.12,i*.09));tone(1568,.5,'sine',.1,.5)};

 const c=wx,s=wc.width/D;c.setTransform(s,0,0,s,0,0);c.clearRect(0,0,D,D);const R=D/2,cx=R,cy=R+8,rw=186;
 // rim

 c.beginPath();c.arc(cx,cy,R-8,0,7);c.fillStyle=g;c.fill();
 // slices
 for(let i=0;i<NS;i++){const G=GAMES[i%GAMES.length],a0=rot+i*SL;

  c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,rw,a0,a0+SL);c.closePath();c.fillStyle=g;c.fill();
  c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=2;c.stroke();
  c.save();c.translate(cx,cy);c.rotate(a0+SL/2);c.textAlign='right';c.textBaseline='middle';
  c.lineWidth=4;c.strokeStyle='rgba(0,0,0,.35)';c.fillStyle='#fff';
  const wd=(G.t||G.n).toUpperCase().split(' '),ln=wd.length>1?[wd[0],wd.slice(1).join(' ')]:[wd[0]];let fs=21; // two-line labels that always fit the slice
  for(;fs>12;fs--){c.font='800 '+fs+'px Montserrat,system-ui';if(Math.max(...ln.map(s=>c.measureText(s).width))<=104)break}
  ln.forEach((s,j)=>{const y=(j-(ln.length-1)/2)*(fs+2);c.strokeText(s,rw-44,y);c.fillText(s,rw-44,y)});
  c.font='26px system-ui';c.fillText(G.i,rw-14,1);c.restore()}
 // inner shade + bulbs
 g=c.createRadialGradient(cx,cy,rw*.7,cx,cy,rw);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.25)');c.beginPath();c.arc(cx,cy,rw,0,7);c.fillStyle=g;c.fill();
 for(let i=0;i<20;i++){const a=i/20*Math.PI*2,on=(i+Math.floor(tt*(spinning?16:3)))%2===0,x=cx+Math.cos(a)*(rw+(R-8-rw)/2),y=cy+Math.sin(a)*(rw+(R-8-rw)/2);
  if(on){const h=c.createRadialGradient(x,y,0,x,y,12);h.addColorStop(0,'rgba(255,255,255,.95)');h.addColorStop(1,'rgba(255,255,200,0)');c.fillStyle=h;c.fillRect(x-12,y-12,24,24)}
  c.beginPath();c.arc(x,y,4.2,0,7);c.fillStyle=on?'#fff':'#9A5E00';c.fill()}
 // hub
 g=c.createRadialGradient(cx-8,cy-8,3,cx,cy,40);g.addColorStop(0,'#FFF1A8');g.addColorStop(1,'#E39A00');c.beginPath();c.arc(cx,cy,38,0,7);c.fillStyle=g;c.fill();c.lineWidth=4;c.strokeStyle='#B36B00';c.stroke();
 c.font='30px system-ui';c.textAlign='center';c.textBaseline='middle';c.fillText('🐾',cx,cy+2);
 // pointer
 c.save();c.translate(cx,cy-R+30);c.rotate(wob);c.beginPath();c.moveTo(-17,-24);c.lineTo(17,-24);c.lineTo(0,26);c.closePath();
 c.fillStyle='#fff';c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=10;c.fill();c.shadowBlur=0;c.lineWidth=4;c.strokeStyle='#E8423B';c.stroke();
 c.beginPath();c.arc(0,-12,5,0,7);c.fillStyle='#E8423B';c.fill();c.restore()}

/* ---------- spin ---------- */
const rndInt=n=>{try{return crypto.getRandomValues(new Uint32Array(1))[0]%n}catch(e){return Math.floor(Math.random()*n)}};
const ease=t=>1-Math.pow(1-t,4);
$('spin').onclick=()=>{
 if(spinning||done)return;ac();tone(440,.12,'square',.06);

 const gi=rndInt(GAMES.length),slice=gi+GAMES.length*rndInt(NS/GAMES.length),jit=(Math.random()-.5)*SL*.6; // random game, random matching slice
 const base=-Math.PI/2-(slice+.5)*SL+jit,start=rot,twoPi=Math.PI*2;
 let target=base-Math.ceil((base-start)/twoPi)*twoPi;while(target<start+twoPi*5)target+=twoPi; // always forward, 5+ turns
 const dur=6200,t0=performance.now();pick=GAMES[gi];
 (function f(now){const p=Math.min(1,(now-t0)/dur);rot=start+(target-start)*ease(p);
  const k=Math.floor(((rot+Math.PI/2)%twoPi+twoPi)%twoPi/SL);
  if(k!==lastTick){lastTick=k;tick();wob=.5}
  if(p<1)requestAnimationFrame(f);else{spinning=false;done=true;setTimeout(reveal,450)}})(t0)};

 $('ic').textContent=pick.i;$('gn').textContent=pick.n;$('res').classList.add('on')}

function launch(G){if(G.u){location.href=G.u;return}
 const bytes=Uint8Array.from(atob(EMB[G.e]),c=>c.charCodeAt(0));
 location.href=URL.createObjectURL(new Blob([bytes],{type:'text/html;charset=utf-8'}))}
$('play').onclick=()=>{$('res').classList.remove('on');$('lau').classList.add('on');$('lt').textContent='LAUNCHING '+pick.n.toUpperCase();
 let c=3;$('cd').textContent=c;tone(600,.15,'square',.08);
 const iv=setInterval(()=>{c--;if(c>0){$('cd').textContent=c;tone(600,.15,'square',.08)}else{clearInterval(iv);$('cd').textContent='GO!';tone(1000,.3,'square',.1);setTimeout(()=>launch(pick),350)}},800)};

/* ---------- background + confetti ---------- */
const bg=$('bg'),bx=bg.getContext('2d'),cf=$('cf'),cx2=cf.getContext('2d');let P=[],F=[];
function sizeAll(){bg.width=cf.width=innerWidth;bg.height=cf.height=innerHeight;sizeW();
 P=Array.from({length:34},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:5+Math.random()*10,v:10+Math.random()*28,k:Math.random()*3|0,ph:Math.random()*6}))}
function boom(x,y,n){const cols=['#FFC93C','#FF5C8A','#2FE0CB','#9C8CFF','#fff','#FF8566'];for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*10;F.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,s:5+Math.random()*7,c:cols[Math.random()*6|0],r:Math.random()*6,w:Math.random()*.4-.2,l:1})}}
let last=performance.now();
(function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;tt+=dt;wob*=.86;
 bx.clearRect(0,0,bg.width,bg.height);
 for(const p of P){p.y-=p.v*dt;p.x+=Math.sin(tt+p.ph)*.3;if(p.y<-20){p.y=bg.height+20;p.x=Math.random()*bg.width}
  bx.save();bx.translate(p.x,p.y);bx.rotate(tt*.6+p.ph);bx.globalAlpha=.28;
  const g=bx.createRadialGradient(0,0,0,0,0,p.r*2);g.addColorStop(0,'rgba(255,201,60,.55)');g.addColorStop(1,'rgba(255,201,60,0)');bx.fillStyle=g;bx.fillRect(-p.r*2,-p.r*2,p.r*4,p.r*4);
  bx.fillStyle='#FFC93C';bx.beginPath();if(p.k===0){bx.moveTo(0,-p.r);bx.lineTo(p.r*.9,p.r*.7);bx.lineTo(-p.r*.9,p.r*.7);bx.closePath()}else if(p.k===1)bx.arc(0,0,p.r*.8,0,7);else bx.rect(-p.r*.7,-p.r*.7,p.r*1.4,p.r*1.4);bx.fill();bx.restore()}
 cx2.clearRect(0,0,cf.width,cf.height);
 for(const f of F){f.vy+=.35;f.x+=f.vx;f.y+=f.vy;f.vx*=.99;f.r+=f.w;f.l-=dt*.45;cx2.save();cx2.globalAlpha=Math.max(0,f.l);cx2.translate(f.x,f.y);cx2.rotate(f.r);cx2.fillStyle=f.c;cx2.fillRect(-f.s/2,-f.s/4,f.s,f.s/2);cx2.restore()}
 F=F.filter(f=>f.l>0&&f.y<cf.height+30);
 drawWheel()})(last);
addEventListener('resize',sizeAll);sizeAll();
